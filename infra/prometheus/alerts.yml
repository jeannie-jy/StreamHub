groups:
  - name: streamhub-mq
    rules:
      - alert: RocketMqConsumerLagHigh
        expr: max by (consumer_group) (streamhub_mq_consumer_lag) > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RocketMQ consumer lag is high"
          description: "Consumer group {{ $labels.consumer_group }} has more than 1000 pending messages for 5 minutes."

      - alert: RocketMqDeadLetterPending
        expr: max(streamhub_mq_deadletter_new) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RocketMQ dead letters require attention"
          description: "At least one persisted dead letter is waiting for replay or ignore."

      - alert: RocketMqOutboxBacklogHigh
        expr: max(streamhub_mq_outbox_pending) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MQ outbox backlog is high"
          description: "More than 100 outbox events have been pending for 5 minutes."

      - alert: RocketMqOutboxOldestPendingTooOld
        expr: max(streamhub_mq_outbox_oldest_age_seconds) > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MQ outbox delivery is stalled"
          description: "The oldest pending outbox event is more than 5 minutes old."

      - alert: RocketMqOutboxDeliveryExhausted
        expr: max(streamhub_mq_outbox_failed) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MQ outbox retries exhausted"
          description: "At least one outbox event exhausted its configured delivery attempts."
