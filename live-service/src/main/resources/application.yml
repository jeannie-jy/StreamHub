spring:
  application:
    name: streamhub-live
  config:
    import:
      - optional:nacos:streamhub-shared.yaml?group=${NACOS_CONFIG_GROUP:STREAMHUB}&refreshEnabled=true
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:STREAMHUB}&refreshEnabled=true
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: ${NACOS_CONFIG_ENABLED:true}
    openfeign:
      client:
        config:
          streamhub-user:
            connect-timeout: ${USER_SERVICE_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${USER_SERVICE_READ_TIMEOUT_MS:2000}
            logger-level: basic
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/streamhub?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:streamhub}
    password: ${DB_PASSWORD:streamhub}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

streamhub:
  media:
    rtmp-publish-base: ${MEDIA_RTMP_PUBLISH_BASE:rtmp://localhost:1935/live/}
    http-flv-play-base: ${MEDIA_HTTP_FLV_PLAY_BASE:/live/}
    webrtc-play-base: ${MEDIA_WEBRTC_PLAY_BASE:/rtc/v1/whep/?app=live&stream=}
  realtime:
    channel: ${STREAMHUB_REALTIME_CHANNEL:live:room:events}
    node-id: ${STREAMHUB_NODE_ID:local}
    max-sessions-per-room: ${STREAMHUB_MAX_SESSIONS_PER_ROOM:10000}
    max-chat-events-per-second: ${STREAMHUB_MAX_CHAT_EVENTS_PER_SECOND:1000}
  reconciliation:
    enabled: ${STREAMHUB_RECONCILIATION_ENABLED:true}
    fixed-delay-ms: ${STREAMHUB_RECONCILIATION_FIXED_DELAY_MS:60000}
    pending-age-ms: ${STREAMHUB_RECONCILIATION_PENDING_AGE_MS:30000}
    batch-size: ${STREAMHUB_RECONCILIATION_BATCH_SIZE:100}
    lock-key: ${STREAMHUB_RECONCILIATION_LOCK_KEY:streamhub:lock:reconciliation}
  rocketmq:
    namesrv-addr: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
    gift-topic: ${ROCKETMQ_GIFT_TOPIC:STREAMHUB_GIFT_ORDER}
    gift-producer-group: ${ROCKETMQ_GIFT_PRODUCER_GROUP:streamhub-gift-producer}
    gift-consumer-group: ${ROCKETMQ_GIFT_CONSUMER_GROUP:streamhub-gift-consumer}
    activity-topic: ${ROCKETMQ_ACTIVITY_TOPIC:STREAMHUB_ACTIVITY_ORDER}
    activity-producer-group: ${ROCKETMQ_ACTIVITY_PRODUCER_GROUP:streamhub-activity-producer}
    activity-consumer-group: ${ROCKETMQ_ACTIVITY_CONSUMER_GROUP:streamhub-activity-consumer-v2}
    timeout-delay-level: ${ROCKETMQ_ACTIVITY_TIMEOUT_DELAY_LEVEL:3}
